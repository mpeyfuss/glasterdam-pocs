[profile.default]
src = "src"
out = "out"
libs = ["dependencies"]
auto_detect_solc = true
optimizer = true
optimizer_runs = 10000
verbosity = 3
gas_reports = []
show_progress = true
fs_permissions = [{ access = "read-write", path = "./.temp"}]

[fuzz]
runs = 1024

[dependencies]
forge-std = "1.17.0"
"@openzeppelin-contracts" = "5.7.0"
solady = "0.1.26"

[rpc_endpoints]
mainnet = "${ETH_RPC_URL}"
sepolia = "${SEPOLIA_RPC_URL}"

[etherscan]
mainnet = { key = "${ETHERSCAN_KEY}" }
sepolia = { key = "${ETHERSCAN_KEY}" }
